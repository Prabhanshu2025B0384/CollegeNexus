# ===================================================================
# College Club Event Management - Application Configuration
# ===================================================================
# All sensitive and environment-specific values are sourced from
# environment variables or .env with sensible local development defaults.
# ===================================================================

# Application Information
spring.application.name=college-club-event-management

# Server Configuration (Render injects PORT dynamically)
server.port=${PORT:8080}

# Database Configuration (Supabase PostgreSQL)
# Reads either DATABASE_URL or DB_URL / DB_USERNAME / DB_PASSWORD
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration (Optimized for fast startup)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# HikariCP Connection Pool Configuration (Optimized for Supabase Pooler & Fast Port Binding)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.initialization-fail-timeout=15000

# Multipart File Upload (for Supabase Storage Event Banners)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Forwarded Headers (for reverse proxy / Render TLS & IP handling)
server.forward-headers-strategy=framework

# Supabase Storage Configuration
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-key=${SUPABASE_SERVICE_KEY:}
app.supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:SDMS}

# JWT Security Configuration (JWT_SECRET must be supplied via environment)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.issuer=campus-nexus
app.jwt.audience=campus-nexus-api

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Initial Admin Credentials for Seeding (must be supplied via environment variables)
app.admin.username=${ADMIN_USERNAME:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:admin@collegeclub.edu}

# Sample Event/Registration Seeding (default false to prevent polluting production database)
app.seed.sample-data=${SEED_SAMPLE_DATA:false}
