# ==============================================================================
# Campus Nexus - Render Blueprint Deployment Configuration
# ==============================================================================
# Deploys the Spring Boot 3 / Java 21 REST API as a Docker Web Service on Render.
# In the Render Dashboard, connect this repository as a Web Service.
# ==============================================================================

services:
  - type: web
    name: campus-nexus-backend
    runtime: docker
    region: oregon
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: admin@gmail.com
      - key: SEED_SAMPLE_DATA
        value: "false"
