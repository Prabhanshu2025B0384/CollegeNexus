# ==============================================================================
# Campus Nexus - Render Blueprint Deployment Configuration
# ==============================================================================
# This configuration deploys the Spring Boot 3 API on Render.
# In the Render Dashboard, connect this repository as a Web Service.
# ==============================================================================

services:
  - type: web
    name: campus-nexus-backend
    runtime: java
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/app.jar
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_VERSION
        value: 21
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: admin@gmail.com
      - key: SEED_SAMPLE_DATA
        value: "false"
